<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You — Elna3om Prosthetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1115;
  --accent:#00e5c7;
  --text:#eef2f4;
  --muted:#8b96a3;
  --display:'Space Grotesk',sans-serif;
  --body:'Inter',sans-serif;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg);color:var(--text);font-family:var(--body);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;
}
.check{
  width:64px;height:64px;border-radius:50%;
  background:rgba(0,229,199,0.12);border:1px solid var(--accent);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 28px;
}
.check svg{width:28px;height:28px;stroke:var(--accent);}
h1{font-family:var(--display);font-size:clamp(26px,4vw,38px);font-weight:600;margin-bottom:16px;}
p{color:var(--muted);font-size:16px;max-width:440px;margin:0 auto 32px;}
a.btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--accent);color:#04120f;
  font-family:var(--display);font-weight:600;font-size:15px;
  padding:14px 28px;border-radius:2px;text-decoration:none;
  transition:box-shadow .25s var(--ease);
}
a.btn:hover{box-shadow:0 8px 30px -6px rgba(0,229,199,0.35);}
</style>
  <link rel="stylesheet" href="light-theme.css">
  <link rel="stylesheet" href="dark-theme.css">
  <link rel="stylesheet" href="theme-toggle.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <div>
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <h1>Consultation Requested</h1>
    <p>Thank you — your appointment request has been sent. A member of our team will reach out shortly to confirm your consultation.</p>
    <a href="index.html" class="btn">← Back to Home</a>
  </div>

  <script src="language.js"></script>
</body>
</html>
